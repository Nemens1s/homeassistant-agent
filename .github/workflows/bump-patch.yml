name: Bump Patch Version

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.BUMP_VERSION_PAT }}

      - uses: astral-sh/setup-uv@v5

      - name: Bump patch version
        id: bump
        run: |
          NEW=$(python3 - <<'EOF'
          import re

          # pyproject.toml is the single source; config.yaml is overwritten
          # with the same value, so the two files can never drift apart.
          PYPROJECT = r'^version = "(\d+)\.(\d+)\.(\d+)"'
          ADDON = r'^version: "[^"]*"'

          text = open("pyproject.toml").read()
          m = re.search(PYPROJECT, text, re.M)
          new = f"{m.group(1)}.{m.group(2)}.{int(m.group(3)) + 1}"
          text = re.sub(PYPROJECT, f'version = "{new}"', text, count=1, flags=re.M)
          open("pyproject.toml", "w").write(text)

          text = open("config.yaml").read()
          text, count = re.subn(ADDON, f'version: "{new}"', text, count=1, flags=re.M)
          assert count == 1, "config.yaml has no version line"
          open("config.yaml", "w").write(text)
          print(new)
          EOF
          )
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - run: uv lock

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml config.yaml uv.lock
          git commit -m "chore: bump patch version to ${{ steps.bump.outputs.version }}"
          git push
