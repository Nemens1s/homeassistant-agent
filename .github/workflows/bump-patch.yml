name: Bump Patch Version

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.BUMP_VERSION_PAT }}
          fetch-depth: 0

      # A PR that sets the version itself (a minor or major release) keeps
      # it: compare pyproject.toml's version line in THIS PR's merge commit
      # with its first parent (main just before the merge). Uses the event's
      # merge commit, not main's tip, so a later merge can't hide it.
      - name: Check for a hand-set version
        id: manual
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          before=$(git show "$MERGE_SHA^1:pyproject.toml" | grep -m1 '^version = ')
          after=$(git show "$MERGE_SHA:pyproject.toml" | grep -m1 '^version = ')
          if [ "$before" != "$after" ]; then
            echo "Version set by the PR ($after); skipping the bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.manual.outputs.skip != 'true'

      - name: Bump patch version
        if: steps.manual.outputs.skip != 'true'
        id: bump
        run: |
          NEW=$(python3 - <<'EOF'
          import re

          # pyproject.toml is the single source; config.yaml is overwritten
          # with the same value, so the two files can never drift apart.
          PYPROJECT = r'^version = "(\d+)\.(\d+)\.(\d+)"'
          ADDON = r'^version: "[^"]*"'

          text = open("pyproject.toml").read()
          m = re.search(PYPROJECT, text, re.M)
          new = f"{m.group(1)}.{m.group(2)}.{int(m.group(3)) + 1}"
          text = re.sub(PYPROJECT, f'version = "{new}"', text, count=1, flags=re.M)
          open("pyproject.toml", "w").write(text)

          text = open("config.yaml").read()
          text, count = re.subn(ADDON, f'version: "{new}"', text, count=1, flags=re.M)
          assert count == 1, "config.yaml has no version line"
          open("config.yaml", "w").write(text)
          print(new)
          EOF
          )
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - run: uv lock
        if: steps.manual.outputs.skip != 'true'

      - name: Commit and push
        if: steps.manual.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml config.yaml uv.lock
          git commit -m "chore: bump patch version to ${{ steps.bump.outputs.version }}"
          git push
