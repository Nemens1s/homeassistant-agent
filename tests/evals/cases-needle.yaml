# Needle fast-path eval cases. Measures confident-fraction x accuracy on the
# trigger-automation subset. Run with: python -m tests.evals.run_needle
# (needs cactus-needle installed; NOT collected by pytest).
#
# `menu` = the AI-controllable automations Needle may trigger. `description` is
# optional but strongly affects confidence (Needle matches on name+description).
# Replace this starter set with your REAL automation.ai_* names + phrasings.

menu:
  # NOTE: descriptions are imperative and avoid cross-tool token overlap. A tiny
  # model latches onto shared words — e.g. "for the night" here + "Movie night"
  # below made "goodnight" match the movie tool. Keep them distinct.
  - entity_id: automation.ai_goodnight
    name: Goodnight
    description: "Start the bedtime routine: turn off the lights and lock the doors."
  - entity_id: automation.ai_movie
    name: Movie time
    description: "Start movie mode: dim the living room and switch on the TV."
  - entity_id: automation.ai_morning
    name: Morning
    description: "Start the morning routine: open the blinds and switch on the kitchen lights."
  - entity_id: automation.ai_away
    name: Leaving home
    description: "Start away mode: switch everything off and arm the alarm."

cases:
  # --- direct phrasings (should fire) ---
  - prompt: "goodnight"
    expect_tool: trigger_automation
    expect_params: {entity_id: automation.ai_goodnight}
  - prompt: "start movie night"
    expect_tool: trigger_automation
    expect_params: {entity_id: automation.ai_movie}
  - prompt: "good morning"
    expect_tool: trigger_automation
    expect_params: {entity_id: automation.ai_morning}
  - prompt: "I'm leaving the house"
    expect_tool: trigger_automation
    expect_params: {entity_id: automation.ai_away}

  # --- indirect phrasings (nice-to-have; measure if they clear the threshold) ---
  - prompt: "time for bed"
    expect_tool: trigger_automation
    expect_params: {entity_id: automation.ai_goodnight}
  - prompt: "let's watch a film"
    expect_tool: trigger_automation
    expect_params: {entity_id: automation.ai_movie}

  # --- reads / non-actions (must NOT fire -> fall through to the agent) ---
  - prompt: "what's the temperature in the kitchen?"
    expect_not_tool: trigger_automation
  - prompt: "is anyone home?"
    expect_not_tool: trigger_automation
  - prompt: "how much battery does my phone have?"
    expect_not_tool: trigger_automation
