# Each case: one prompt, the tool the model MUST call first, and params that
# must match exactly (subset — unlisted params are not checked).
- id: entity_state_direct
  prompt: "What is the state of light.living_room_concorde_smart_plug?"
  expect_tool: get_entity_state
  expect_params:
    entity_id: light.living_room_concorde_smart_plug

- id: list_domain
  prompt: "Which lights do I have?"
  expect_tool: list_entities
  expect_params:
    domain: light

- id: list_area
  prompt: "What devices are in the Living room?"
  expect_any_tool: [list_devices, get_areas]

- id: history_needs_timestamps
  prompt: "Show me the temperature history of sensor.mt6000_temperature for the last 24 hours."
  expect_tool: get_history
  expect_params:
    entity_id: sensor.mt6000_temperature

- id: history_range_today
  prompt: "Show me the temperature history of sensor.mt6000_temperature today."
  expect_tool: get_history
  expect_params:
    entity_id: sensor.mt6000_temperature
    range: today

- id: logbook_range_last_hour
  prompt: "What happened in the house in the last hour?"
  expect_tool: get_logbook
  expect_params:
    range: last_hour

- id: error_log
  prompt: "Is Home Assistant showing any errors?"
  expect_tool: get_error_log

- id: area_names_only
  prompt: "What rooms do I have in my home?"
  expect_tool: get_areas

- id: topology_single_room
  prompt: "What devices are in the bedroom?"
  expect_tool: get_areas
  # name is checked case-insensitively (see runner) — "bedroom"/"Bedroom" both fine.
  expect_params:
    name: bedroom

- id: room_contents
  prompt: "What do I have in my bedroom?"
  # "in my <room>" → room-aware tools. list_entities(area=) is the entities+states
  # path; get_areas / list_devices (names only) are acceptable alternates. The bug
  # this guards against: treating the room as a device — list_entities(device=bedroom).
  expect_any_tool: [list_entities, get_areas, list_devices]
  expect_tool: list_entities
  expect_params:
    area: bedroom

- id: topology_full_map
  prompt: "Show me all rooms and what devices are in each."
  expect_tool: get_areas

- id: automations_list
  prompt: "List my automations and when they last ran."
  expect_tool: get_automations

- id: skill_loading
  prompt: "My automation automation.ai_test_night_lights didn't fire last night, figure out why."
  expect_any_tool: [load_skill, list_skills]
  expect_params:
    name: diagnosing_automations

- id: vacuum_running
  prompt: "Is the vacuum running right now?"
  expect_tool: get_vacuum_state

- id: vacuum_current_room
  prompt: "What room is the Roborock currently cleaning?"
  expect_tool: get_vacuum_state

- id: weather_current
  prompt: "What is the current weather at home?"
  expect_tool: get_weather

- id: battery_sofija_phone
  prompt: "What is Sofija's iPhone battery level?"
  expect_tool: get_battery_status

- id: person_sofija_home
  prompt: "Is Sofija home?"
  expect_tool: get_person_locations

- id: person_anyone_home
  prompt: "Is anyone home?"
  expect_tool: get_person_locations

- id: person_ilja_location
  prompt: "Where is Ilja right now — home or away?"
  expect_tool: get_person_locations

- id: search_zigbee_bridge
  prompt: "What is the current state of the Zigbee2MQTT bridge?"
  expect_tool: search_entities

- id: search_sleeping_helper
  prompt: "Is the sleeping mode helper currently on?"
  expect_tool: search_entities

- id: automation_clean_away
  prompt: "Is the 'clean rooms when no one's home' automation enabled?"
  expect_tool: get_automations

- id: automations_on_leave
  prompt: "Which automations run when everyone leaves home?"
  expect_tool: get_automations

- id: logbook_clean_away_today
  prompt: "Did the clean when away automation run today?"
  expect_tool: get_logbook

- id: troubleshoot_automation_timing
  prompt: "The automation.ai_test_soundbar_night_mode didn't activate last night at the scheduled time — why might that be?"
  expect_any_tool: [load_skill, list_skills]
  expect_params:
    name: diagnosing_automations

- id: troubleshoot_zigbee_buttons
  prompt: "The Zigbee buttons stopped triggering automations — what's the first thing to investigate?"
  expect_any_tool: [load_skill, list_skills]
  expect_params:
    name: diagnosing_automations

- id: turn_off_light
  min_tier: 2
  prompt: "Turn off the living room smart plug light (light.living_room_concorde_smart_plug)."
  expect_tool: control_entity
  expect_params:
    entity_id: light.living_room_concorde_smart_plug
    action: turn_off

#- id: toggle_switch
#  min_tier: 2
#  prompt: "Toggle switch.kitchen_smart_plug."
#  expect_tool: control_entity
#  expect_params:
#    entity_id: switch.kitchen_smart_plug
#    action: toggle

- id: run_automation
  min_tier: 2
  prompt: "Run my automation.ai_test_night_lights automation right now."
  expect_tool: trigger_automation
  expect_params:
    entity_id: automation.ai_test_night_lights

# refuse_lock removed: domain guardrail in control_entity is the structural
# protection. Model may attempt the call; the tool rejects it. Eval was
# fragile (passed only because lock.front_door doesn't exist in test HA).
