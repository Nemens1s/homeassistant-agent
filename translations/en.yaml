configuration:
  llm_provider:
    name: LLM provider
    description: >-
      Which backend serves the model. "ollama" talks to an Ollama server;
      "llamacpp" (or any other value) uses the OpenAI-compatible HTTP API, e.g.
      llama.cpp's llama-server or a cloud provider via LiteLLM.
  llm_url:
    name: LLM URL
    description: >-
      Base URL of the inference server (e.g. http://ollama.home:11435 for
      Ollama, or http://host:8080 for llama-server).
  llm_model:
    name: Model
    description: >-
      Model name/tag to load. For Ollama this is the pull tag; for
      OpenAI-compatible servers it is the model id (some local servers ignore it).
  api_key:
    name: API key
    description: >-
      API key for cloud providers. Leave blank for local servers (a dummy value
      is sent automatically when the server requires a non-empty key).
  allow_actions:
    name: Allow actions
    description: >-
      Off = read-only. On = the agent may trigger ai_* automations/scripts and
      send notifications (still fail-closed behind the AI kill switch).
  ai_actions_switch:
    name: AI actions kill switch
    description: >-
      input_boolean that must be ON for any action-tier tool to run. Empty
      string disables the home-level kill switch (menu and domain guards still apply).
  temperature:
    name: Temperature
    description: >-
      Sampling randomness. 0 = deterministic/greedy; higher = more varied. Small
      instruction models usually do best low (0–0.3).
  top_p:
    name: Top-p (nucleus sampling)
    description: >-
      Keep only the smallest set of tokens whose cumulative probability reaches
      this value. 1.0 disables the cutoff. Lower = more focused output.
  min_p:
    name: Min-p
    description: >-
      Drop tokens whose probability is below this fraction of the most likely
      token. A robust alternative to top-p; 0 disables it. Typical: 0.02–0.1.
  top_k:
    name: Top-k
    description: >-
      Sample only from the K most likely tokens. 0 disables the limit. Lower
      values make output more focused. Typical: 20–40.
  repeat_penalty:
    name: Repeat penalty
    description: >-
      Penalizes tokens that already appeared, reducing loops/repetition. 1.0 =
      no penalty; higher = stronger. Typical: 1.05–1.2.
  seed:
    name: Seed
    description: Fixed RNG seed for reproducible sampling. Change it to vary outputs.
  reasoning:
    name: Reasoning
    description: >-
      Enable the model's thinking/reasoning mode (Ollama only). Off keeps
      responses direct and faster.
  num_predict:
    name: Max output tokens
    description: Upper bound on tokens generated per response.
  num_ctx:
    name: Context window
    description: >-
      Context length (tokens) the model is loaded with. Larger fits more history
      but uses more memory (Ollama only).
  num_gpu:
    name: GPU layers
    description: >-
      Number of model layers offloaded to the GPU. -1 = as many as fit; 0 = CPU
      only (Ollama only).
  keep_alive:
    name: Keep-alive
    description: >-
      How long (seconds) to keep the model loaded in memory after a request.
      -1 = keep loaded indefinitely (Ollama only).
  recursion_limit:
    name: Recursion limit
    description: Max reasoning/tool-call steps the agent may take before stopping a run.
  max_rows:
    name: Max rows
    description: Cap on the number of rows a tool may return, to bound response size.
  max_history_messages:
    name: Max history messages
    description: >-
      After each run, prune stored history to the last N messages (rounded to a
      turn boundary). 0 = keep everything.
  enable_tool_subsetting:
    name: Tool subsetting
    description: >-
      Narrow the tool menu per query. Helps small models pick the right tool;
      turn off to always expose the full tool set.
  fast_path_enabled:
    name: Fast path
    description: >-
      Enable a low-latency external service to trigger ai_* automations/scripts
      directly, skipping the LLM (requires allow_actions on). Off by default.
  fast_path_confidence_threshold:
    name: Fast path confidence threshold
    description: >-
      Fire only when the fast-path service's confidence is at or above this.
      0.0 fires on any emitted call (correct for fine-tuned weights that
      report no confidence).
  fast_path_url:
    name: Fast path service URL
    description: URL of the remote fast-path inference service.
  person_name_map:
    name: Person name map
    description: >-
      Rename people for the agent. ha_name is the Home Assistant friendly_name
      (the lookup key); name is what the agent sees.
  person_name_exclude:
    name: Person exclusions
    description: >-
      Hide person entities whose friendly_name contains any of these substrings
      (case-insensitive) from location output.
  language_layer_enabled:
    name: Language layer
    description: >-
      Accept Russian and Estonian as well as English. The message is translated
      to English before the agent runs and the reply is translated back; the
      agent itself stays English-only. Off = nothing changes and the translation
      service is never called.
  lang_mt_url:
    name: Translation service URL
    description: >-
      Base URL of the lang-mt detection/translation service (e.g.
      http://192.168.1.4:10100). Used only while the language layer is on; if it
      is unreachable, replies fall back to English instead of failing.
  languages:
    name: Languages
    description: >-
      Languages detection may choose between, as two-letter codes. Restricting
      the list is what stops short Estonian commands being read as Finnish.
  default_language:
    name: Default language
    description: >-
      Language assumed when detection is unsure and the conversation has no
      previous language to fall back on.
  min_confidence:
    name: Minimum detection confidence
    description: >-
      Below this confidence, the language of the previous message in the same
      conversation is used instead of the detected one, then the default
      language. Raise it if short commands get the wrong language.
  lang_mt_timeout_s:
    name: Translation timeout
    description: >-
      Seconds to wait for the translation service before giving up on that hop.
      A timeout means the agent still answers — in English.
  telemetry_enabled:
    name: Telemetry
    description: >-
      Record what each request did — prompts, tool calls, timings and replies —
      to a local SQLite file for the Metrics tab. Everything stays on this
      machine; nothing is sent anywhere. Turn it off to record nothing.
  watched_entities:
    name: Watched entities
    description: >-
      Entities the agent may watch for state-triggered notes (e.g. "tell me
      when the laundry is done"). Empty = state-triggered notes are off.
  clock_entity:
    name: Clock entity
    description: >-
      A World Clock sensor ("HH:MM DD-MM-YYYY") used for time-triggered notes
      and scheduling. Empty = time-triggered notes are off.
  event_confirmations_enabled:
    name: Event confirmations
    description: >-
      Off = the agent still acts on fired notes, but sends no confirmation
      message (reminders the user asked for are always sent).
  notify_action:
    name: Notify action script
    description: >-
      The only script notify_user may call to send a message to the user.
  extra_instructions:
    name: Extra instructions
    description: >-
      Household-specific instructions appended after the built-in base
      prompt (e.g. preferred names, phrasing, or house rules). Leave blank to
      use only the built-in prompt.
  memory_note_default_ttl_hours:
    name: Default note lifetime (hours)
    description: >-
      How long a memory note stays armed when the agent does not set its own
      lifetime.
  memory_note_max_ttl_hours:
    name: Maximum note lifetime (hours)
    description: Upper bound on any memory note's lifetime.
  time_note_grace_minutes:
    name: Time note grace (minutes)
    description: >-
      A time-triggered note this many minutes late expires instead of firing.
  disabled_tools:
    name: Disabled tools
    description: >-
      Tool names the agent should never be offered, regardless of tier or
      whether a matching entity exists. Empty = nothing switched off beyond
      that.
  vacuum_entity:
    name: Vacuum entity
    description: >-
      Which vacuum.* entity get_vacuum_state uses when this home has more
      than one. Empty = the first vacuum.* sorted by entity_id.
  skills_enabled:
    name: Skills
    description: >-
      Enable user-supplied troubleshooting playbooks. Off by default — no
      skills ship in the image. Drop markdown files into the skills folder
      (see docs/examples/skills/ for the format) and turn this on to let the
      agent load them with load_skill.
