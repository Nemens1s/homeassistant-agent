<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gosling</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h2>Agent Gosling</h2>
    <nav class="tabs">
      <a href="index.html" class="tab active">Chat</a>
      <a href="metrics.html" class="tab">Metrics</a>
      <a href="actions.html" class="tab">Actions</a>
      <a href="notes.html" class="tab">Notes</a>
    </nav>
  </header>
  <div class="layout">
    <div class="chat-column">
      <div id="llm-banner" class="llm-banner" hidden></div>
      <main id="log"></main>
      <form id="row">
        <div id="command-chips" class="command-chips" hidden>
          <button type="button" data-cmd="/actions">/actions</button>
          <button type="button" data-cmd="/run ">/run</button>
          <button type="button" data-cmd="/notes">/notes</button>
          <button type="button" data-cmd="/cancel ">/cancel</button>
          <button type="button" data-cmd="/help">/help</button>
        </div>
        <input id="input" placeholder="Ask about your home…" autocomplete="off" autofocus />
        <button id="send" type="submit">→</button>
      </form>
    </div>
    <aside class="sidebar">
      <button id="thinking-toggle" class="sidebar-btn" type="button">💭 Show Thinking</button>
      <button id="reset" class="sidebar-btn" type="button">+ New</button>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
