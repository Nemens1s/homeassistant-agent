<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gosling</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h2>Agent Gosling</h2>
  </header>
  <div class="layout">
    <div class="chat-column">
      <main id="log"></main>
      <form id="row">
        <input id="input" placeholder="Ask about your home…" autocomplete="off" autofocus />
        <button id="send" type="submit">→</button>
      </form>
    </div>
    <aside class="sidebar">
      <button id="thinking-toggle" class="sidebar-btn" type="button">💭 Show Thinking</button>
      <button id="reset" class="sidebar-btn" type="button">+ New</button>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
