<!DOCTYPE html>
<html lang="en">

<title>Agent Gosling — Actions</title>

</head>
<body>
  <header>
    <h2>Agent Gosling</h2>
    <nav class="tabs">
      <a href="index.html" class="tab">Chat</a>
      <a href="metrics.html" class="tab">Metrics</a>

  <main class="actions-main">
    <div id="error-banner" class="banner" hidden></div>

      </section>
      <section class="actions-section" id="scripts-section" hidden>
        <h3 class="actions-section-title">Scripts</h3>
        <ul class="actions-ul" id="scripts-list"></ul>
      </section>
    </div>

  <script src="actions.js"></script>
