name: "Agent Gosling"
version: "0.4.30"
slug: agent_gosling
description: "Chat agent over Home Assistant state, powered by a local models (cloud models optional via LiteLLM)"
url: "https://github.com/Nemens1s/homeassistant-agent"
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: "Agent Gosling"
watchdog: "http://[HOST]:[PORT:8099]/api/health"
map:
  - config:ro
options:
  llm_url: ""
  llm_model: ""
  api_key: ""
  allow_actions: false
  # empty string disables the home-level AI kill switch (menu + domain guards still apply)
  ai_actions_switch: "input_boolean.ai_triggered_actions"
  notify_action: "script.ai_action_notify"
  extra_instructions: ""
  # Event-triggered memory notes. Empty watched_entities = state notes off;
  # empty clock_entity = time notes off.
  watched_entities: []
  clock_entity: ""
  event_confirmations_enabled: true
  person_name_map: []
  # Language layer: off = today's behaviour, lang-mt is never called.
  language_layer_enabled: false
  languages:
    - en
  disabled_tools: []
backup_exclude:
  - "telemetry.sqlite*"
schema:
  llm_provider: "str?"
  llm_url: "str"
  llm_model: "str"
  api_key: "password"
  allow_actions: "bool"
  ai_actions_switch: "str"
  temperature: "float(0,2)?"
  top_p: "float(0,1)?"
  min_p: "float(0,1)?"
  top_k: "int(0,1000)?"
  repeat_penalty: "float(0,2)?"
  seed: "int?"
  reasoning: "bool?"
  num_predict: "int(128,32768)?"
  num_ctx: "int(1024,131072)?"
  num_gpu: "int(-1,999)?"
  keep_alive: "int?"
  recursion_limit: "int(2,50)?"
  max_rows: "int(5,500)?"
  max_history_messages: "int(0,10000)?"
  enable_tool_subsetting: "bool?"
  fast_path_enabled: "bool?"
  fast_path_confidence_threshold: "float(0,1)?"
  fast_path_url: "str?"
  person_name_map:
    - ha_name: str
      name: str
  person_name_exclude: ["str?"]
  language_layer_enabled: "bool"
  lang_mt_url: "str?"
  languages: ["str"]
  default_language: "str?"
  min_confidence: "float(0,1)?"
  lang_mt_timeout_s: "float(0.1,60)?"
  telemetry_enabled: "bool?"
  watched_entities: ["str"]
  clock_entity: "str"
  event_confirmations_enabled: "bool"
  memory_note_default_ttl_hours: "int(1,720)?"
  memory_note_max_ttl_hours: "int(1,720)?"
  time_note_grace_minutes: "int(1,1440)?"
  disabled_tools: ["str"]
  vacuum_entity: "str?"
  skills_enabled: "bool?"
  notify_action: "str"
  extra_instructions: "str?"
