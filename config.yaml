name: "Local HA Agent (Ollama)"
version: "0.3.0"
slug: local_ha_agent
description: "Chat agent over Home Assistant state, powered by a local Ollama server (cloud models optional via LiteLLM)"
url: "https://github.com/yourname/homeassistant-ollama-agent"
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: "HA Agent"
watchdog: "http://[HOST]:[PORT:8099]/api/health"
options:
  llm_provider: "ollama"
  ollama_url: "http://192.168.1.50:11434"
  llm_model: "hf.co/empero-ai/Qwen3.8-2B-GGUF:Q6_K"
  api_key: ""
  system_prompt: >-
    You are an assistant for this Home Assistant instance.
    Answer questions about the home using the available tools.
    Always look up real data with tools instead of guessing.
    Be concise and factual.
  max_tier: 1
  allowed_domains:
    - light
    - switch
    - fan
    - automation
  # empty string disables the home-level AI kill switch (menu + domain guards still apply)
  ai_actions_switch: "input_boolean.ai_triggered_actions"
  temperature: 0.0
  seed: 42
  reasoning: false
  num_predict: 2048
  num_ctx: 8192
  keep_alive: -1
  recursion_limit: 15
  max_rows: 50
  enable_tool_subsetting: true
  needle_enabled: false
  needle_model_path: ""
  needle_confidence_threshold: 0.85
  needle_menu_ttl_s: 60
  needle_backend: "cactus"
  needle_sidecar_url: ""
  person_name_map: []
  person_name_exclude: []
schema:
  llm_provider: "str"
  ollama_url: "url"
  llm_model: "str"
  api_key: "password"
  system_prompt: "str"
  max_tier: "int(1,2)"
  allowed_domains: ["str"]
  ai_actions_switch: "str"
  temperature: "float(0,2)"
  seed: "int"
  reasoning: "bool"
  num_predict: "int(128,32768)"
  num_ctx: "int(1024,131072)"
  keep_alive: "int"
  recursion_limit: "int(2,50)"
  max_rows: "int(5,500)"
  enable_tool_subsetting: "bool"
  needle_enabled: "bool"
  needle_model_path: "str"
  needle_confidence_threshold: "float(0,1)"
  needle_menu_ttl_s: "int(1,3600)"
  needle_backend: "list(cactus|sidecar)"
  needle_sidecar_url: "str?"
  person_name_map:
    - ha_name: str
      name: str
  person_name_exclude: ["str"]
