name: "Agent Gosling"
version: "0.4.11"
slug: agent_gosling
description: "Chat agent over Home Assistant state, powered by a local models (cloud models optional via LiteLLM)"
url: "https://github.com/Nemens1s/homeassistant-agent"
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: "Agent Gosling"
watchdog: "http://[HOST]:[PORT:8099]/api/health"
options:
  llm_provider: "llamacpp"
  llm_url: "http://ollama.home:11435"
  llm_model: "openbmb/MiniCPM5-2B-GGUF:Q4_K_M"
  api_key: ""
  system_prompt: >-
    You are an assistant for this Home Assistant instance.
    Answer questions about the home using the available tools.
    Always look up real data with tools instead of guessing.
    Be concise and factual.
  max_tier: 1
  allowed_domains:
    - light
    - switch
    - fan
    - automation
  # empty string disables the home-level AI kill switch (menu + domain guards still apply)
  ai_actions_switch: "input_boolean.ai_triggered_actions"
  temperature: 0.0
  top_p: 0.95
  min_p: 0.05
  top_k: 40
  repeat_penalty: 1.1
  seed: 42
  reasoning: false
  num_predict: 2048
  num_ctx: 16384
  num_gpu: 36
  keep_alive: -1
  recursion_limit: 15
  max_rows: 50
  # /data persists across App restarts; empty string keeps memory in-RAM
  checkpoint_db_path: "/data/checkpoints.sqlite"
  # cap stored history per thread to the last N messages (0 = keep everything)
  max_history_messages: 40
  enable_tool_subsetting: true
  needle_enabled: false
  needle_confidence_threshold: 0.0
  needle_menu_ttl_s: 60
  needle_remote_url: ""
  person_name_map: []
  person_name_exclude: []
  # Telemetry (local SQLite + optional OTLP). Set telemetry_enabled=false to opt out.
  telemetry_enabled: true
  telemetry_db_path: "/data/telemetry.sqlite"
  telemetry_retention_days: 0
  otlp_endpoint: ""
backup_exclude:
  - "telemetry.sqlite*"
schema:
  llm_provider: "str"
  llm_url: "url"
  llm_model: "str"
  api_key: "password"
  system_prompt: "str"
  max_tier: "int(1,2)"
  allowed_domains: ["str"]
  ai_actions_switch: "str"
  temperature: "float(0,2)"
  top_p: "float(0,1)"
  min_p: "float(0,1)"
  top_k: "int(0,1000)"
  repeat_penalty: "float(0,2)"
  seed: "int"
  reasoning: "bool"
  num_predict: "int(128,32768)"
  num_ctx: "int(1024,131072)"
  num_gpu: "int(-1,999)"
  keep_alive: "int"
  recursion_limit: "int(2,50)"
  max_rows: "int(5,500)"
  checkpoint_db_path: "str?"
  max_history_messages: "int(0,10000)"
  enable_tool_subsetting: "bool"
  needle_enabled: "bool"
  needle_confidence_threshold: "float(0,1)"
  needle_menu_ttl_s: "int(1,3600)"
  needle_remote_url: "str"
  person_name_map:
    - ha_name: str
      name: str
  person_name_exclude: ["str"]
  telemetry_enabled: "bool"
  telemetry_db_path: "str?"
  telemetry_retention_days: "int"
  otlp_endpoint: "str?"
